<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <nav>
      <div class="logo">Weather Thor-cast</div>
      <label class="scale-btn hidden">
        <input type="checkbox" />
        <span class="toggle-slider">
          <span class="toggle-label-left">°F</span>
          <span class="toggle-label-right">°C</span>
        </span>
      </label>
      <form action="" class="search-bar">
        <label for="location">
          <input type="text" id="location" />
        </label>
        <label for="submit">
          <button id="submit">Search</button>
        </label>
      </form>
    </nav>
    <main class="hidden">
      <div class="today weather-box">
        <div>
          <div class="temp"></div>
          <div class="feels-like"></div>
          <div class="desc"></div>
          <div class="message"></div>
        </div>
        <img src="data:," alt="" class="icon" />
      </div>
      <div class="future-boxes">
        <div class="future weather-box day-1">
          <div>
            <div class="day"></div>
            <div class="date"></div>
            <div class="temp"></div>
            <div class="desc"></div>
          </div>
          <img src="data:," alt="" class="icon" />
        </div>
        <div class="future weather-box day-2">
          <div>
            <div class="day"></div>
            <div class="date"></div>
            <div class="temp"></div>
            <div class="desc"></div>
          </div>
          <img src="data:," alt="" class="icon" />
        </div>
        <div class="future weather-box day-3">
          <div>
            <div class="day"></div>
            <div class="date"></div>
            <div class="temp"></div>
            <div class="desc"></div>
          </div>
          <img src="data:," alt="" class="icon" />
        </div>
        <div class="future weather-box day-4">
          <div>
            <div class="day"></div>
            <div class="date"></div>
            <div class="temp"></div>
            <div class="desc"></div>
          </div>
          <img src="data:," alt="" class="icon" />
        </div>
      </div>
    </main>
  </body>
</html>
