<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <nav>
      <div>Weather Thor-cast</div>
      <label class="scale-btn">
        <input type="checkbox" />
        <span class="slider"></span>
      </label>
      <form action="" class="search-bar">
        <label for="location">
          <input type="text" id="location" />
        </label>
        <label for="submit">
          <button id="submit">Search</button>
        </label>
      </form>
    </nav>
    <main>
      <div class="today weather-box">
        <div class="temp"></div>
        <div class="feels-like"></div>
        <div class="desc"></div>
        <div class="message"></div>
        <img src="data:," alt="" class="icon" />
      </div>
      <div class="future weather-box day-1">
        <div class="date"></div>
        <div class="temp"></div>
        <div class="desc"></div>
        <img src="data:," alt="" class="icon" />
      </div>
      <div class="future weather-box day-2">
        <div class="date"></div>
        <div class="temp"></div>
        <div class="desc"></div>
        <img src="data:," alt="" class="icon" />
      </div>
      <div class="future weather-box day-3">
        <div class="date"></div>
        <div class="temp"></div>
        <div class="desc"></div>
        <img src="data:," alt="" class="icon" />
      </div>
      <div class="future weather-box day-4">
        <div class="date"></div>
        <div class="temp"></div>
        <div class="desc"></div>
        <img src="data:," alt="" class="icon"/>
      </div>
    </main>
  </body>
</html>
